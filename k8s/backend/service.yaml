apiVersion: v1
kind: Service
metadata:
  name: stellar-viaduct-backend
  namespace: stellar-viaduct
  labels:
    app.kubernetes.io/name: stellar-viaduct
    app.kubernetes.io/component: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "3001"
spec:
  selector:
    app: stellar-viaduct-backend
  ports:
    - name: http
      port: 3001
      targetPort: 3001
      protocol: TCP
  type: ClusterIP
